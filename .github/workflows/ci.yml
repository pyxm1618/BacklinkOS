name: BacklinkOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install --ignore-scripts

      - name: Run TypeScript tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Python regression tests
        id: python-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee python-tests.log

      - name: Upload Python regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-regression-log
          path: python-tests.log

      - name: Enforce Python regression result
        if: steps.python-tests.outcome == 'failure'
        run: exit 1
