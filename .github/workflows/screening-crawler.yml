name: BacklinkOS Screening Crawler

on:
  push:
    paths:
      - data/screening-candidates/RUN
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run regression tests
        run: python -m unittest tests/test_screening_crawler.py -v

      - name: Build candidate CSV
        run: |
          echo 'domain' > /tmp/screening-candidates.csv
          cat data/screening-candidates/[0-9][0-9][0-9].txt | sed '/^$/d' | sort -u >> /tmp/screening-candidates.csv
          echo "Candidates: $(($(wc -l < /tmp/screening-candidates.csv)-1))"

      - name: Crawl pending backlink domains
        run: python scripts/screening_crawler.py --input /tmp/screening-candidates.csv --output screening-results.jsonl --workers 40 --timeout 8

      - name: Persist results
        run: |
          mkdir -p data/screening-results
          cp screening-results.jsonl data/screening-results/latest.jsonl
          cp screening-results.jsonl.summary.json data/screening-results/latest.summary.json
          git config user.name 'BacklinkOS Bot'
          git config user.email 'backlinkos-bot@users.noreply.github.com'
          git add data/screening-results/latest.jsonl data/screening-results/latest.summary.json
          git diff --cached --quiet || git commit -m 'Update bulk screening crawl results'
          git push

      - name: Upload screening results
        uses: actions/upload-artifact@v4
        with:
          name: screening-results
          path: |
            screening-results.jsonl
            screening-results.jsonl.summary.json
          if-no-files-found: error
