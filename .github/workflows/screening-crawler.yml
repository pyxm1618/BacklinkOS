name: BacklinkOS Screening Triage Crawler

# This workflow is an operational bulk-triage helper. Its machine buckets are
# preliminary and do not replace the evidence contract in
# .agents/skills/screening-backlinks/.
on:
  push:
    paths:
      - data/screening-candidates/RUN
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run triage regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build deduplicated incremental input
        run: >-
          python scripts/prepare_screening_input.py
          --candidate-dir data/screening-candidates
          --existing-results data/screening-results/latest.jsonl
          --existing-status data/opportunities/internal-status.csv
          --output /tmp/screening-candidates.csv
          --manifest screening-input-manifest.json

      - name: Crawl candidate domains for preliminary triage
        run: >-
          python scripts/screening_crawler.py
          --input /tmp/screening-candidates.csv
          --output screening-results.jsonl
          --existing-results data/screening-results/latest.jsonl
          --workers 40
          --timeout 8

      - name: Persist latest triage snapshot
        run: |
          mkdir -p data/screening-results
          cp screening-results.jsonl data/screening-results/latest.jsonl
          cp screening-results.jsonl.summary.json data/screening-results/latest.summary.json
          git config user.name 'BacklinkOS Bot'
          git config user.email 'backlinkos-bot@users.noreply.github.com'
          git add data/screening-results/latest.jsonl data/screening-results/latest.summary.json
          git diff --cached --quiet || git commit -m 'Update bulk screening crawl results'
          git push

      - name: Upload triage results
        uses: actions/upload-artifact@v4
        with:
          name: screening-results
          path: |
            screening-results.jsonl
            screening-results.jsonl.summary.json
            screening-input-manifest.json
          if-no-files-found: error
