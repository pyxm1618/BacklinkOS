name: BacklinkOS Screening Crawler

on:
  push:
    paths:
      - data/screening-candidates/**
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run regression tests
        run: python -m unittest tests/test_screening_crawler.py -v

      - name: Build candidate CSV
        run: |
          echo 'domain' > /tmp/screening-candidates.csv
          cat data/screening-candidates/*.txt | sed '/^$/d' | sort -u >> /tmp/screening-candidates.csv
          echo "Candidates: $(($(wc -l < /tmp/screening-candidates.csv)-1))"

      - name: Crawl pending backlink domains
        run: python scripts/screening_crawler.py --input /tmp/screening-candidates.csv --output screening-results.jsonl --workers 40 --timeout 8

      - name: Upload screening results
        uses: actions/upload-artifact@v4
        with:
          name: screening-results
          path: |
            screening-results.jsonl
            screening-results.jsonl.summary.json
          if-no-files-found: error
